<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHALOM — Hors connexion</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05070a;
        color: #f4f2ec;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      svg {
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 500;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.875rem;
        color: rgba(244, 242, 236, 0.6);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f4f2ec" stroke-width="1.5" stroke-linecap="round">
        <line x1="12" y1="2.5" x2="12" y2="21.5" />
        <line x1="6" y1="8" x2="18" y2="8" />
      </svg>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Vos versets favoris, vos prières et votre journal restent disponibles une fois l'application
        rechargée avec une connexion. Le verset du jour et votre progression du parcours sont
        conservés localement sur cet appareil.
      </p>
    </div>
  </body>
</html>
